apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br-ext
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    description: External network bridge for VMs
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "br-ext",
      "type": "cnv-bridge",
      "bridge": "br-ext",
      "macspoofchk": true,
      "ipam": {}
    }
