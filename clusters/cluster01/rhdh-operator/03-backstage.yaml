apiVersion: rhdh.redhat.com/v1alpha4
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh-operator
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  application:
    replicas: 1
    appConfig:
      mountPath: /opt/app-root/src
    extraEnvs:
      envs:
        - name: LOG_LEVEL
          value: debug
    route:
      enabled: true
      tls:
        enabled: true
        termination: edge
  database:
    enableLocalDb: true
